<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 02: Desconstructed Pancake</title>
    <style>
        ul{
            list-style: none;
            margin: 0;
            padding: 0;
        }
        li{
            border: 1px solid blue;
            background-color: lightblue;
            padding: 0.1em;
        }
        .desconstructed-pancake{
            display: flex;
            flex-wrap: wrap;
        }
        .desconstructed-pancake > *{
            /*flex-grow: 1;
            flex-shrink: 1;
            flex-basis: 100px;*/
            flex: 1 1 100px;
        }
    </style>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <main>
        <article>
            <ul class="desconstructed-pancake">
                <li>Primeiro</li>
                <li>Segundo</li>
                <li>Terceiro</li>
                <li>Quarto</li>
                <li>Quinto</li>
            </ul>
        </article>
    </main>
</body>
</html>
